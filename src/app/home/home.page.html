<ion-header class="ion-no-border">
  <ion-toolbar class="innopsi-toolbar">
    <ion-title class="innopsi-header-title">InnoPsi</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" title="Cerrar sesión" fill="clear" color="dark">
        <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="innopsi-screen-bg" [fullscreen]="true">
  
  <div class="home-wrapper">

    <!-- Tarjeta informativa del paciente y doctor vinculado -->
    <div class="patient-doctor-badge" *ngIf="currentUser">
      <div class="user-greeting">
        <ion-icon name="heart" class="heart-icon"></ion-icon>
        <span>Hola, <strong>{{ currentUser.displayName }}</strong></span>
      </div>
      <div class="assigned-doc" *ngIf="currentUser.assignedDoctorName">
        <ion-icon name="medkit-outline"></ion-icon>
        <span>Tu especialista: <strong>{{ currentUser.assignedDoctorName }}</strong></span>
      </div>
    </div>

    <!-- Menú central con los botones en tonos rosa exactamente como el screenshot -->
    <div class="menu-buttons-container">
      
      <!-- Botón 1: Horario Medicamentos -->
      <button type="button" class="innopsi-pill-button" (click)="goTo('medication-schedule')">
        Horario Medicamentos
      </button>

      <!-- Botón 2: Estado emocional -->
      <button type="button" class="innopsi-pill-button" (click)="goTo('emotional-state')">
        Estado emocional
      </button>

      <!-- Botón 3: Diario de seguimiento -->
      <button type="button" class="innopsi-pill-button" (click)="goTo('diary')">
        Diario de seguimiento
      </button>

      <!-- Botón 4: Mensajes directos (nuevo botón solicitado) -->
      <button type="button" class="innopsi-pill-button chat-pill-btn" (click)="goTo('chat')">
        <ion-icon name="chatbubble-ellipses-outline" class="btn-icon"></ion-icon>
        Mensajes directos
      </button>

    </div>

    <!-- Sutil pie de página informativo -->
    <div class="footer-info">
      <p>Cuidado y acompañamiento para tu bienestar</p>
    </div>

  </div>

</ion-content>
