<ion-header class="ion-no-border">
  <ion-toolbar class="innopsi-top-banner">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="backRoute" text="" color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title class="innopsi-serif-title">Mensajes Directos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="innopsi-screen-bg" [fullscreen]="true">
  
  <div class="chat-wrapper">
    
    <!-- Barra con la información de la persona con la que se habla -->
    <div class="chat-partner-banner">
      <div class="avatar-circle">
        <ion-icon [name]="isCurrentUserDoctor ? 'person-outline' : 'medkit-outline'"></ion-icon>
      </div>
      <div class="partner-info">
        <h3>{{ partnerName }}</h3>
        <p>{{ isCurrentUserDoctor ? 'Paciente asignado' : 'Tu psicólogo/psiquiatra especialista' }}</p>
      </div>
    </div>

    <!-- Lista de mensajes en tiempo real -->
    <div class="messages-list">
      <div 
        class="message-bubble" 
        *ngFor="let msg of messages"
        [ngClass]="msg.senderId === currentUserId ? 'outgoing' : 'incoming'">
        
        <span class="sender-name">{{ msg.senderName }}</span>
        <p class="msg-text">{{ msg.text }}</p>
        <span class="msg-time">{{ msg.timestamp }}</span>
      </div>
    </div>

    <!-- Barra inferior para redactar y enviar -->
    <div class="chat-input-bar">
      <input 
        type="text" 
        class="input-field" 
        [(ngModel)]="newMessageText" 
        (keyup.enter)="sendMessage()"
        placeholder="Escribe un mensaje de apoyo o consulta...">

      <button 
        type="button" 
        class="send-btn" 
        [disabled]="!newMessageText.trim()"
        (click)="sendMessage()">
        <ion-icon name="send-outline"></ion-icon>
      </button>
    </div>

  </div>

</ion-content>
